<!DOCTYPE html>
<html lang="ko">
<head>

    <title>PF 패밀리의 오늘 뭐 먹지? 🍕</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Canvas Confetti CDN (폭죽 효과용) -->

    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #fae8ff 40%, #e0e7ff 70%, #dbeafe 100%);
            min-height: 100vh;
        }

        /* 커스텀 그림자 및 빛나는 효과 */
        .glow-effect {
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.25);
        }

        .btn-glow {
            box-shadow: 0 8px 25px rgba(244, 63, 94, 0.4);
            transition: all 0.2s ease-in-out;
        }

        .btn-glow:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(244, 63, 94, 0.6);
        }

        .btn-glow:active:not(:disabled) {
            transform: translateY(1px);
        }

        /* 모달 애니메이션 */
        @keyframes modalPop {
            0% { transform: scale(0.8) translateY(20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .animate-modal {
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(244, 114, 182, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(244, 114, 182, 0.7);
        }

        /* 돼지 캐릭터 둥둥 애니메이션 */
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: floatSlow 4s ease-in-out infinite;
        }
    </style>
</head>

    <!-- JavaScript 로직 -->
    <script>
        // --- 데이터 상태 (초기 메뉴 목록에 햄버거 포함) ---
        const DEFAULT_MENUS = ['치킨', '피자', '중국집', '분식', '보쌈', '햄버거'];
        let menus = [...DEFAULT_MENUS];

        // 감각적이고 선명한 색상 팔레트
        const COLOR_PALETTE = [
            '#ef4444', // Red
            '#f97316', // Orange
            '#f59e0b', // Amber
            '#10b981', // Emerald
            '#06b6d4', // Cyan
            '#3b82f6', // Blue
            '#8b5cf6', // Violet
            '#ec4899', // Pink
            '#f43f5e', // Rose
            '#84cc16'  // Lime
        ];

        // --- Web Audio API (효과음 생성기) ---
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // 룰렛 회전 시 핀 지나치는 틱(Tick) 소리
        function playTickSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                // 짧은 고음 틱 소리
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.04);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.04);
            } catch (e) {
                // 오디오 재생 실패 무시
            }
        }

        // 당첨 빵빠레(Fanfare) 승리 효과음
        function playFanfareSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                
                // 빵빠레 화음 노트 (도-미-솔-도)
                const notes = [
                    { f: 523.25, t: 0,    d: 0.15 }, // C5
                    { f: 659.25, t: 0.12, d: 0.15 }, // E5
                    { f: 783.99, t: 0.24, d: 0.18 }, // G5
                    { f: 1046.50, t: 0.40, d: 0.60 } // C6 (길게)
                ];

                notes.forEach(note => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(note.f, now + note.t);

                    gain.gain.setValueAtTime(0.2, now + note.t);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(now + note.t);
                    osc.stop(now + note.t + note.d);
                });
            } catch (e) {
                // 오디오 재생 실패 무시
            }
        }

        // --- 룰렛 애니메이션 상태 변수 ---
        const canvas = document.getElementById('rouletteCanvas');
        const ctx = canvas.getContext('2d');
        
        let currentAngle = 0; // 현재 룰렛 각도 (Radian)
        let isSpinning = false;
        let spinAnimationId = null;
        let lastSliceIndex = -1; // 틱 소리 감지용 이전 슬라이스 인덱스

        // --- 초기화 ---
        window.addEventListener('load', () => {
            renderChips();
            drawRoulette();
        });

        // --- 룰렛 그리기 (Canvas API) ---
        function drawRoulette() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const outerRadius = width / 2 - 20;

            // 캔버스 초기화
            ctx.clearRect(0, 0, width, height);

            const numSlices = menus.length;

            if (numSlices === 0) {
                // 메뉴가 없을 때 빈 배경 그리기
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, outerRadius, 0, 2 * Math.PI);
                ctx.fillStyle = '#334155';
                ctx.fill();
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 8;
                ctx.stroke();

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 36px "Noto Sans KR", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('메뉴를 추가해 주세요!', centerX, centerY);
                ctx.restore();
                return;
            }

            const sliceAngle = (2 * Math.PI) / numSlices;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(currentAngle);

            // 각 조각 그리기
            for (let i = 0; i < numSlices; i++) {
                const startAngle = i * sliceAngle;
                const endAngle = startAngle + sliceAngle;
                const color = COLOR_PALETTE[i % COLOR_PALETTE.length];

                // 扇形 (부채꼴)
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, outerRadius, startAngle, endAngle);
                ctx.closePath();

                ctx.fillStyle = color;
                ctx.fill();

                // 테두리 구분선
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#0f172a';
                ctx.stroke();

                // 텍스트 출력
                ctx.save();
                const textAngle = startAngle + sliceAngle / 2;
                ctx.rotate(textAngle);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';

                // 글자 수에 따른 폰트 크기 조절
                const text = menus[i];
                let fontSize = 42;
                if (numSlices > 8) fontSize = 34;
                if (numSlices > 12) fontSize = 28;
                if (text.length > 5) fontSize -= 6;

                ctx.font = `900 ${fontSize}px "Noto Sans KR", sans-serif`;
                
                // 그림자 효과
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetX = 2;
                ctx.shadowOffsetY = 2;

                ctx.fillText(text, outerRadius - 50, 0);
                ctx.restore();
            }

            // Outer Shadow & Inner Circle Rim
            ctx.restore();

            // 외곽 테두리 링
            ctx.beginPath();
            ctx.arc(centerX, centerY, outerRadius, 0, 2 * Math.PI);
            ctx.lineWidth = 12;
            ctx.strokeStyle = '#1e293b';
            ctx.stroke();
        }

        // --- 룰렛 회전 애니메이션 (감속 회전) ---
        function spinRoulette() {
            if (isSpinning) return;

            if (menus.length < 2) {
                showAlertModal("메뉴는 최소 2개 이상 등록해야 룰렛을 돌릴 수 있습니다! 🍕");
                return;
            }

            // 사용자 클릭 시 오디오 컨텍스트 활성화
            getAudioContext();

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            // 회전 시간 설정 (3.5 ~ 5초)
            const minDuration = 3500;
            const randomDuration = Math.random() * 1500;
            const duration = minDuration + randomDuration;
            
            const startAngle = currentAngle;
            // 최소 5바퀴 이상 + 랜덤 회전각
            const totalRotation = (Math.PI * 2 * (5 + Math.floor(Math.random() * 5))) + (Math.random() * Math.PI * 2);
            
            const startTime = performance.now();
            lastSliceIndex = -1;

            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Ease Out Cubic (자연스러운 감속 효과)
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = startAngle + (totalRotation * easeOut);
                drawRoulette();

                // 핀(Pointer) 영역을 통과하는 조각이 바뀔 때마다 틱 소리 재생
                if (menus.length > 0) {
                    const numSlices = menus.length;
                    const sliceAngle = (2 * Math.PI) / numSlices;
                    let normalizedAngle = currentAngle % (2 * Math.PI);
                    if (normalizedAngle < 0) normalizedAngle += (2 * Math.PI);
                    
                    let pointerAngle = (1.5 * Math.PI - normalizedAngle) % (2 * Math.PI);
                    if (pointerAngle < 0) pointerAngle += (2 * Math.PI);

                    const currentSliceIndex = Math.floor(pointerAngle / sliceAngle) % numSlices;
                    if (currentSliceIndex !== lastSliceIndex) {
                        if (lastSliceIndex !== -1) {
                            playTickSound();
                        }
                        lastSliceIndex = currentSliceIndex;
                    }
                }

                if (progress < 1) {
                    spinAnimationId = requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    calculateWinner();
                }
            }

            spinAnimationId = requestAnimationFrame(animate);
        }

        // --- 당첨자 계산 & 팝업 모달 연출 ---
        function calculateWinner() {
            const numSlices = menus.length;
            const sliceAngle = (2 * Math.PI) / numSlices;

            // 현재 각도를 0 ~ 2PI 범위로 정규화
            let normalizedAngle = currentAngle % (2 * Math.PI);
            if (normalizedAngle < 0) normalizedAngle += (2 * Math.PI);

            // 포인터(화살표) 위치는 12시 방향 (1.5 * Math.PI)
            let pointerAngle = (1.5 * Math.PI - normalizedAngle) % (2 * Math.PI);
            if (pointerAngle < 0) pointerAngle += (2 * Math.PI);

            const winningIndex = Math.floor(pointerAngle / sliceAngle) % numSlices;
            const winningMenu = menus[winningIndex];

            showWinnerModal(winningMenu);
            triggerConfetti();
            playFanfareSound(); // 빵빠레 당첨 효과음 재생
        }

        // --- 폭죽 애니메이션 (canvas-confetti) ---
        function triggerConfetti() {
            if (typeof confetti === 'function') {
                const count = 200;
                const defaults = { origin: { y: 0.7 } };

                function fire(particleRatio, opts) {
                    confetti(Object.assign({}, defaults, opts, {
                        particleCount: Math.floor(count * particleRatio)
                    }));
                }

                fire(0.25, { spread: 26, startVelocity: 55 });
                fire(0.2, { spread: 60 });
                fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
                fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
                fire(0.1, { spread: 120, startVelocity: 45 });
            }
        }

        // --- 메뉴 관리 (추가, 삭제, 칩 렌더링) ---
        function handleAddMenu(event) {
            event.preventDefault();
            const input = document.getElementById('menuInput');
            const menuName = input.value.trim();

            if (!menuName) return;

            if (menus.includes(menuName)) {
                showAlertModal('이미 등록되어 있는 메뉴입니다! 😋');
                return;
            }

            if (menus.length >= 16) {
                showAlertModal('메뉴는 최대 16개까지만 추가할 수 있습니다.');
                return;
            }

            menus.push(menuName);
            input.value = '';
            
            renderChips();
            drawRoulette();
        }

        function removeMenu(index) {
            if (isSpinning) return;
            menus.splice(index, 1);
            renderChips();
            drawRoulette();
        }

        function resetToDefault() {
            if (isSpinning) return;
            menus = [...DEFAULT_MENUS];
            renderChips();
            drawRoulette();
        }

        function clearAllMenus() {
            if (isSpinning) return;
            menus = [];
            renderChips();
            drawRoulette();
        }

        // 등록된 메뉴 칩(Chip) 렌더링
        function renderChips() {
            const container = document.getElementById('chipContainer');
            const badge = document.getElementById('menuCountBadge');
            
            badge.textContent = `${menus.length}개`;
            container.innerHTML = '';

            if (menus.length === 0) {
                container.innerHTML = `<span class="text-xs text-slate-500 py-2">등록된 메뉴가 없습니다. 메뉴를 추가해 보세요!</span>`;
                return;
            }

            menus.forEach((menu, index) => {
                const color = COLOR_PALETTE[index % COLOR_PALETTE.length];
                const chip = document.createElement('div');
                chip.className = `flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-white shadow-md transition-all hover:scale-105 select-none`;
                chip.style.backgroundColor = color;
                
                chip.innerHTML = `
                    <span>${escapeHtml(menu)}</span>
                    <button onclick="removeMenu(${index})" title="삭제" class="hover:bg-black/20 rounded-full w-4 h-4 flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark text-[10px]"></i>
                    </button>
                `;
                container.appendChild(chip);
            });
        }

        // --- 모달 팝업 컨트롤 ---
        function showWinnerModal(winningMenu) {
            document.getElementById('winnerMenuText').textContent = winningMenu;
            document.getElementById('winnerSpan').textContent = winningMenu;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        function showAlertModal(msg) {
            document.getElementById('alertMessageText').textContent = msg;
            document.getElementById('alertModal').classList.remove('hidden');
        }

        function closeAlertModal() {
            document.getElementById('alertModal').classList.add('hidden');
        }

        // XSS 방지용 HTML 이스케이프
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
